name: Glett
options:
  bundleIdPrefix: no.glett
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: nb
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  GlettKit:
    path: GlettKit
targets:
  Glett:
    type: application
    platform: iOS
    sources:
      - path: Glett
        type: syncedFolder
      - path: Shared
        type: syncedFolder
      - path: WidgetViews
        type: syncedFolder
    info:
      path: Config/Glett-Info.plist
      properties:
        # glett://place?lat=&lon=&name=[&geo=1]: the widgets and the Live Activity open the app at their place
        CFBundleURLTypes:
          - CFBundleURLName: no.glett.app
            CFBundleURLSchemes: [glett]
    dependencies:
      - package: GlettKit
      - target: GlettWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.glett.app
        PRODUCT_NAME: Glett
        # App Group group.no.glett.shared (brief §3.1): settings, saved places and the forecast cache shared with the
        # widgets and the watch. A device build needs the group registered for the team (automatic signing does it).
        CODE_SIGN_ENTITLEMENTS: Config/Glett.entitlements
        # device builds sign by hand with the profile the scripts name (scripts/testflight-upload.sh, install-device.sh)
        PROVISIONING_PROFILE_SPECIFIER: $(GLETT_APP_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glett
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # the Live Activity "Neste glett" (brief §6)
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Glett bruker posisjonen din til å vise været der du er."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        # Only HTTPS and Apple's own encryption: exempt, so TestFlight and the App Store ask no export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GlettWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        type: syncedFolder
      - path: WidgetViews
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: GlettKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/GlettWidgets-Info.plist
      properties:
        CFBundleDisplayName: Glett
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # "Min posisjon" as a widget's place (brief §6)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The widgets (brief §6): read the app's App Group (settings, places, the forecast cache).
        PRODUCT_BUNDLE_IDENTIFIER: no.glett.app.widgets
        PRODUCT_NAME: GlettWidgets
        CODE_SIGN_ENTITLEMENTS: Config/GlettWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(GLETT_WIDGETS_PROFILE)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
schemes:
  Glett:
    build:
      targets:
        Glett: all
    test:
      targets: []
