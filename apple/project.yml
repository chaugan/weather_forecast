name: Glett
options:
  bundleIdPrefix: no.glett
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: nb
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  GlettKit:
    path: GlettKit
targets:
  Glett:
    type: application
    platform: iOS
    sources:
      - path: Glett
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: GlettKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.glett.app
        PRODUCT_NAME: Glett
        # App Group group.no.glett.shared (brief §3.1): settings, saved places and the forecast cache shared with the
        # widgets and the watch. A device build needs the group registered for the team (automatic signing does it).
        CODE_SIGN_ENTITLEMENTS: Config/Glett.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glett
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Glett bruker posisjonen din til å vise været der du er."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Glett:
    build:
      targets:
        Glett: all
    test:
      targets: []
